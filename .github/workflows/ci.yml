name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: digifactory
          POSTGRES_PASSWORD: yappy_seattle_2056
          POSTGRES_DB: digifactory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U digifactory"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Compile production runtime
        run: python -m compileall -q backend/services/agent_runtime.py backend/services/worker_leases.py backend/services/capability_guard.py backend/services/printify_service.py backend/services/etsy_service.py backend/services/pod_workflow.py backend/services/software_factory.py backend/workers/mission_control.py backend/workers/task_execution.py

      - name: Run tests
        run: python -m pytest backend/tests/ -q
        env:
          DATABASE_URL: postgresql://digifactory:yappy_seattle_2056@localhost:5432/digifactory

  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
