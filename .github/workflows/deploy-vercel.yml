name: Deploy Pauli's Place to Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: paulis-place-vercel-production
  cancel-in-progress: true

jobs:
  readiness:
    name: Vercel deployment readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frontend is production-buildable
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

  deploy-production:
    name: Deploy production
    needs: readiness
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_2MkWeFBaSCv7DOvEy0OlX4s3
      VERCEL_PROJECT_ID: prj_dPv8hJP4QMmAhN4AEW62H5zpQFxU
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed when deployment authority is not configured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo 'VERCEL_TOKEN is not configured. Source is verified, but production deploy is intentionally blocked.'
          exit 1
      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install --global vercel@latest
      - name: Pull production project settings
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with Vercel production settings
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production artifact
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
