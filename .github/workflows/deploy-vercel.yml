name: Deploy Pauli's Place to Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: paulis-place-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Vercel deployment readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify frontend is production-buildable
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

  authority:
    name: Vercel deployment authority
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report deployment authority on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::warning::VERCEL_TOKEN is not configured. Source can be reviewed, but production deployment remains human-gated.'
          else
            echo 'Vercel deployment authority is configured. Token value is never printed.'
          fi
      - name: Fail closed without deployment authority on production events
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is not configured. Production deployment is blocked until a token or Git connection is installed.'
            exit 1
          fi
          echo 'Vercel deployment authority is configured. Token value is never printed.'

  deploy-production:
    name: Deploy production
    if: ${{ github.event_name != 'pull_request' }}
    needs: [readiness, authority]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_2MkWeFBaSCv7DOvEy0OlX4s3
      VERCEL_PROJECT_ID: prj_dPv8hJP4QMmAhN4AEW62H5zpQFxU
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production project settings
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with Vercel production settings
        working-directory: frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production artifact
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
