version: 2
project_name: printify2-pp-cli
changelog:
  disable: true
builds:
  - id: printify2-pp-cli
    main: ./cmd/printify2-pp-cli
    binary: printify2-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X printify2-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: printify2-pp-mcp
    main: ./cmd/printify2-pp-mcp
    binary: printify2-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: printify2-pp-cli
    repository:
      owner: executiveusa
      name: homebrew-tap
    homepage: "https://github.com/executiveusa/printify2-pp-cli"
    description: "Printify API enables you to automate product and order creation for a variety of scenarios"
    install: |
      bin.install "printify2-pp-cli"
      bin.install "printify2-pp-mcp"
