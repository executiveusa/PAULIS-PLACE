services:
  # Optional local-development database. Production uses DATABASE_URL from .env,
  # which should point at the canonical Supabase/Postgres control plane.
  db:
    image: postgres:15-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pauli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pauli_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-pauli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pauli}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - generated_assets:/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A workers.celery_app worker -l info -c 4
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A workers.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  # Optional local UI. Production frontend is deployed by Vercel.
  frontend:
    build: ./frontend
    profiles: ["local"]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  generated_assets:
